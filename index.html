<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat's Cradle Duel</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #f0f4ff 0%, #f7fbff 100%);
      color: #14213d;
      display: flex;
      justify-content: center;
      padding: 18px;
    }
    .app { width: min(920px, 100%); }
    .top-tray {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .2);
      margin-bottom: 12px;
    }
    .pill-wrap { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      background: rgba(148, 163, 184, .22);
      border: 1px solid rgba(148, 163, 184, .35);
      color: #f8fafc;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .pill strong { color: #93c5fd; }
    .restart {
      border: 0;
      border-radius: 10px;
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      padding: 10px 12px;
      cursor: pointer;
    }
    .board-wrap {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
      padding: 10px;
    }
    .status {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.35;
      background: #e8f0ff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #cfe0ff;
    }
    canvas {
      width: 100%;
      height: auto;
      touch-action: none;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #e6ebf5;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top-tray">
    <div class="pill-wrap">
      <div class="pill" id="turnPill"></div>
      <div class="pill" id="selectedPill"></div>
    </div>
    <button id="restart" class="restart">Restart</button>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="700" height="900"></canvas>
    <div id="status" class="status"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const restartBtn = document.getElementById('restart');
const turnPillEl = document.getElementById('turnPill');
const selectedPillEl = document.getElementById('selectedPill');

const HOUSE = { id: 'H', x: 350, y: 80, r: 24 };
const POINTS = [
  {id:1,x:150,y:210},{id:2,x:330,y:210},{id:3,x:520,y:210},
  {id:4,x:120,y:360},{id:5,x:300,y:360},{id:6,x:510,y:360},
  {id:7,x:130,y:510},{id:8,x:320,y:510},{id:9,x:520,y:510},
  {id:10,x:140,y:680},{id:11,x:350,y:680},{id:12,x:540,y:680}
].map(p => ({...p, r: 15}));

let state;

function init() {
  state = {
    visited: new Set(),
    lines: [],
    currentId: 'H',
    caller: 'p1',
    drawer: 'p2',
    selectedTarget: null,
    gameOver: false,
    drawing: null,
  };
  updateTopTray();
  setStatus('Player 1: click a number on the board for Player 2 to draw.');
  draw();
}

function label(playerId) {
  return playerId === 'p1' ? 'Player 1' : 'Player 2';
}

function pointById(id) {
  if (id === 'H') return HOUSE;
  return POINTS.find(p => p.id === id);
}

function setStatus(msg){ statusEl.textContent = msg; }

function updateTopTray(){
  turnPillEl.innerHTML = `<strong>Turn:</strong> ${label(state.caller)} calls → ${label(state.drawer)} draws`;
  const targetLabel = state.selectedTarget == null ? 'None' : (state.selectedTarget === 'H' ? 'Cat House' : state.selectedTarget);
  selectedPillEl.innerHTML = `<strong>Selected:</strong> ${targetLabel}`;
}

function chooseTarget(id){
  if (state.gameOver || state.selectedTarget || state.visited.has(id)) return;
  state.selectedTarget = id;
  updateTopTray();
  setStatus(`${label(state.caller)} selected ${id}. ${label(state.drawer)} draw from ${state.currentId} to ${id}.`);
  draw();
}

function switchRoles(){
  [state.caller, state.drawer] = [state.drawer, state.caller];
  updateTopTray();
}

function afterSuccessfulDraw(targetId, points){
  state.lines.push({fromId: state.currentId, toId: targetId, drawer: state.drawer, points});
  if (targetId !== 'H') state.visited.add(targetId);
  state.currentId = targetId;

  if (targetId === 'H' && state.visited.size === POINTS.length) {
    state.gameOver = true;
    updateTopTray();
    setStatus(`${label(state.drawer)} wins by connecting back to Cat House!`);
    draw();
    return;
  }

  state.selectedTarget = null;
  switchRoles();

  if (state.visited.size === POINTS.length) {
    state.selectedTarget = 'H';
    updateTopTray();
    setStatus(`${label(state.caller)} selected Cat House. ${label(state.drawer)} draw from ${state.currentId} back to Cat House.`);
  } else {
    setStatus(`${label(state.caller)}: click next number on board for ${label(state.drawer)}.`);
  }

  draw();
}

function invalidRetry(reason){
  setStatus(`${reason} Retry same turn: ${label(state.drawer)} draw again to ${state.selectedTarget === 'H' ? 'Cat House' : state.selectedTarget}.`);
  draw();
}

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function pointOnCircle(center, approachPoint, radius){
  const dx = center.x - approachPoint.x;
  const dy = center.y - approachPoint.y;
  const len = Math.hypot(dx, dy) || 1;
  return {
    x: center.x - (dx / len) * radius,
    y: center.y - (dy / len) * radius
  };
}

function isValidPath(path, fromId, toId){
  for (const p of path) {
    if (p.x < 15 || p.y < 15 || p.x > canvas.width - 15 || p.y > canvas.height - 15) return false;
  }

  const blocked = POINTS.filter(p => p.id !== fromId && p.id !== toId);
  for (const p of path) {
    for (const n of blocked) {
      if (dist(p,n) < n.r + 5) return false;
    }
    if (fromId !== 'H' && toId !== 'H' && dist(p,HOUSE) < HOUSE.r + 6) return false;
  }

  const segs = toSegments(path);
  for (const line of state.lines) {
    const prev = toSegments(line.points);
    for (const s1 of segs) {
      for (const s2 of prev) {
        if (segmentsIntersect(s1.a,s1.b,s2.a,s2.b)) return false;
      }
    }
  }
  return true;
}

function toSegments(path){
  const segs=[];
  for(let i=1;i<path.length;i++) segs.push({a:path[i-1], b:path[i]});
  return segs;
}

function ccw(a,b,c){ return (c.y-a.y)*(b.x-a.x) > (b.y-a.y)*(c.x-a.x); }
function segmentsIntersect(a,b,c,d){
  if ((a.x===c.x&&a.y===c.y)||(a.x===d.x&&a.y===d.y)||(b.x===c.x&&b.y===c.y)||(b.x===d.x&&b.y===d.y)) return false;
  return ccw(a,c,d) !== ccw(b,c,d) && ccw(a,b,c) !== ccw(a,b,d);
}

function pointerPos(e){
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: (t.clientX - rect.left) * (canvas.width / rect.width),
    y: (t.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function hitNode(pos){
  for (const p of POINTS) {
    if (!state.visited.has(p.id) && dist(pos, p) <= p.r + 12) return p;
  }
  return null;
}

function boardClick(e){
  if (state.gameOver || state.selectedTarget) return;
  const pos = pointerPos(e);
  const node = hitNode(pos);
  if (node) chooseTarget(node.id);
}

function startDraw(e){
  if (state.gameOver || !state.selectedTarget) return;
  const from = pointById(state.currentId);
  const pos = pointerPos(e);
  if (dist(pos, from) > from.r + 16) return;
  state.drawing = [{x:from.x, y:from.y}];
}

function moveDraw(e){
  if (!state.drawing) return;
  const pos = pointerPos(e);
  const last = state.drawing.at(-1);
  if (dist(pos, last) > 3) state.drawing.push(pos);
  draw();
}

function endDraw(){
  if (!state.drawing) return;
  const target = pointById(state.selectedTarget);
  const end = state.drawing.at(-1);
  const path = [...state.drawing];
  state.drawing = null;

  if (dist(end, target) > target.r + 16) {
    invalidRetry(`Path must end on ${state.selectedTarget === 'H' ? 'Cat House' : `number ${state.selectedTarget}`}.`);
    return;
  }

  const prev = path[path.length - 2] || path[0];
  const endOnCircle = pointOnCircle(target, prev, target.r);
  path.push(endOnCircle);

  if (!isValidPath(path, state.currentId, state.selectedTarget)) {
    invalidRetry('Line crossed/touched blocked area.');
    return;
  }

  afterSuccessfulDraw(state.selectedTarget, path);
}

function drawPath(points,color,width=3){
  if(points.length<2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
  ctx.stroke();
}

function drawNode(p, active=false){
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = active ? '#f97316' : '#0f172a';
  ctx.lineWidth = active ? 3 : 2;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#0f172a';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(p.id), p.x, p.y + 0.5);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(const line of state.lines){
    drawPath(line.points, line.drawer === 'p1' ? '#2563eb' : '#16a34a', 3);
  }
  if(state.drawing) drawPath(state.drawing, '#dc2626', 2);

  ctx.fillStyle = '#fde68a';
  ctx.strokeStyle = state.selectedTarget === 'H' ? '#f97316' : '#7c2d12';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(HOUSE.x,HOUSE.y,HOUSE.r,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#7c2d12';
  ctx.font = 'bold 12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('CAT', HOUSE.x, HOUSE.y-4);
  ctx.fillText('HOUSE', HOUSE.x, HOUSE.y+9);

  POINTS.forEach(p => drawNode(p, state.selectedTarget === p.id));
}

canvas.addEventListener('click', boardClick);
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', e => { startDraw(e); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e => { moveDraw(e); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', e => { endDraw(e); e.preventDefault(); }, {passive:false});
restartBtn.addEventListener('click', init);

init();
</script>
</body>
</html>
