<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat's Cradle Duel (Firebase RTDB)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap');
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Nunito', Arial, sans-serif;
      background: radial-gradient(circle at top, #fff0e8 0%, #ffe7da 35%, #ffd8c8 100%);
      color: #12213f;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: calc(10px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));
    }
    .app { width: min(560px, 100%); display: grid; gap: 10px; }
    .panel {
      background: #fff8f4;
      border-radius: 18px;
      border: 1px solid #ffd9c7;
      box-shadow: 0 10px 28px rgba(233, 108, 65, .16);
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .hidden { display: none !important; }

    .top-tray {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      background: linear-gradient(140deg, #f97316 0%, #ea580c 100%);
      border-radius: 14px;
      padding: 12px;
      color: #fff7ed;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .18);
      align-items: center;
    }
    .pill-wrap { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .pill {
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(2,132,199,.26);
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }
    .pill strong { color: #99f6e4; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      font-weight: 800;
      cursor: pointer;
      min-height: 42px;
    }
    .btn-green { background: #14b8a6; color: #042f2e; }
    .btn-gray { background: #fff1e8; color: #9a3412; border: 1px solid #fdba74; }

    .room-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .room-controls button, .room-controls input, .status {
      border-radius: 10px;
      border: 1px solid #ccdaef;
      font-size: 14px;
      padding: 10px;
      min-height: 42px;
    }
    .room-controls button { background: #ffedd5; color:#9a3412; font-weight: 800; cursor: pointer; }
    .room-controls button:disabled { opacity: .55; cursor: not-allowed; }
    .status { margin: 0; background: #fff2e9; border-color:#ffd1ba; line-height: 1.35; }

    .hint { margin: 0; font-size: 12px; opacity: .9; }
    h3 { font-family: 'Fredoka', cursive; color: #9a3412; font-size: 26px; letter-spacing: .3px; }
    .floating { animation: glowPulse 2.8s ease-in-out infinite; }
    @keyframes glowPulse { 0%,100% { box-shadow: 0 10px 28px rgba(233, 108, 65, .14);} 50% { box-shadow: 0 14px 30px rgba(20, 184, 166, .18);} }
    .board-wrap { position: relative; }
    .hotspots { position: absolute; inset: 0; pointer-events: none; }
    .hotspot-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(15,23,42,.22);
      background: rgba(255,255,255,.01);
      color: transparent;
      pointer-events: auto;
      cursor: pointer;
    }
    .hotspot-btn:disabled { pointer-events: none; opacity: .25; }

    canvas {
      width: 100%;
      height: auto;
      max-height: calc(100dvh - 250px);
      border-radius: 10px;
      border: 1px solid #e6ebf5;
      background: #fffaf7;
      touch-action: none;
      aspect-ratio: 9 / 20;
    }
  </style>
</head>
<body>
<div class="app">
  <div id="lobbyPage" class="panel floating">
    <h3 style="margin:4px 0 2px;">Cat's Cradle Lobby</h3>
    <div class="room-controls">
      <button id="createRoom">Create Room</button>
      <div id="lobbyRoomLabel" class="status">No room yet.</div>
      <button id="joinRoom">Join Room</button>
      <input id="roomCodeInput" maxlength="5" placeholder="Paste room code" />
    </div>
    <div id="lobbyStatus" class="status">Create a room or join with code.</div>
    <p class="hint"><strong>Step:</strong> both players use this page first. After room create/join, game page opens automatically.</p>
  </div>

  <div id="gamePage" class="hidden">
    <div class="top-tray">
      <div class="pill-wrap">
        <div class="pill" id="turnPill">Turn: -</div>
        <div class="pill" id="selectedPill">Selected: -</div>
        <div class="pill" id="rolePill">Role: -</div>
      </div>
      <div class="actions">
        <button id="restart" class="btn btn-green">Restart</button>
        <button id="leaveRoom" class="btn btn-gray">Leave Room</button>
      </div>
    </div>

    <div class="panel">
      <div class="board-wrap">
        <canvas id="board" width="700" height="1560"></canvas>
        <div id="boardHotspots" class="hotspots"></div>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>
</div>

<script>
  if (location.protocol === 'file:') window.__catsCradleFileMode = true;
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
import { getDatabase, ref, get, set, update, onValue, runTransaction } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js';
import { animate, stagger } from 'https://esm.sh/framer-motion@11.3.19';

const firebaseConfig = {
  apiKey: 'AIzaSyB9B1ZXYPep-PeNeo_D35Kf1kofpB9GR3Q',
  authDomain: 'cats-cradle-10e30.firebaseapp.com',
  projectId: 'cats-cradle-10e30',
  storageBucket: 'cats-cradle-10e30.firebasestorage.app',
  messagingSenderId: '807058658558',
  appId: '1:807058658558:web:060f0292e84b0bcfde81af',
  databaseURL: 'https://cats-cradle-10e30-default-rtdb.europe-west1.firebasedatabase.app'
};

const lobbyPage = document.getElementById('lobbyPage');
const gamePage = document.getElementById('gamePage');
const lobbyStatusEl = document.getElementById('lobbyStatus');
const lobbyRoomLabelEl = document.getElementById('lobbyRoomLabel');

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const restartBtn = document.getElementById('restart');
const leaveRoomBtn = document.getElementById('leaveRoom');
const turnPillEl = document.getElementById('turnPill');
const selectedPillEl = document.getElementById('selectedPill');
const rolePillEl = document.getElementById('rolePill');
const createRoomBtn = document.getElementById('createRoom');
const joinRoomBtn = document.getElementById('joinRoom');
const roomCodeInput = document.getElementById('roomCodeInput');
const hotspotsEl = document.getElementById('boardHotspots');

if (window.__catsCradleFileMode) {
  const msg = 'Opened by double click (file://). UI works, but online room sync may fail in some browsers. Prefer local server for multiplayer.';
  lobbyStatusEl.textContent = msg;
  console.warn('[CatGame] file mode', msg);
}

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const HOUSE = { id: 'H', x: 350, y: 150, r: 28 };
function createGridPoints() {
  const columns = 3, rows = 4;
  const left = 155, right = 545, top = 360, bottom = 1170;
  const xStep = (right - left) / (columns - 1);
  const yStep = (bottom - top) / (rows - 1);
  const points = [];
  let id = 1;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < columns; col++) {
      points.push({ id, x: left + xStep * col, y: top + yStep * row, r: 24 });
      id += 1;
    }
  }
  return points;
}
const POINTS = createGridPoints();

function initialGame(waiting = false) {
  return {
    visited: [], lines: [], currentId: 'H', caller: 'p1', drawer: 'p2',
    selectedTarget: null, gameOver: false,
    status: waiting ? 'Waiting for Player 2 to join room...' : 'Player 1: select a number for Player 2 to draw.'
  };
}

const deviceId = (() => {
  const existing = localStorage.getItem('cats_cradle_device_id');
  if (existing) return existing;
  const fallback = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  const value = crypto?.randomUUID ? crypto.randomUUID() : fallback;
  localStorage.setItem('cats_cradle_device_id', value);
  return value;
})();

const state = {
  connected: false,
  roomCode: null,
  yourRole: null,
  players: { p1: false, p2: false },
  game: initialGame(),
  drawing: null,
  unsubscribe: null,
  inGamePage: false
};

function logError(context, err) {
  console.error(`[CatGame] ${context}`, err);
}

function label(playerId) { return playerId === 'p1' ? 'Player 1' : 'Player 2'; }
function pointById(id) { return id === 'H' ? HOUSE : POINTS.find((p) => p.id === Number(id)); }
function setStatus(msg) { statusEl.textContent = msg; }
function setLobbyStatus(msg) { lobbyStatusEl.textContent = msg; }
function canPlay() { return Boolean(state.roomCode && state.players.p1 && state.players.p2); }
function roomPath(code) { return ref(db, `rooms/${code}`); }
function randomCode() { return Math.random().toString(36).slice(2, 7).toUpperCase(); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function determineRole(players) {
  if (!players) return null;
  if (players.p1 === deviceId) return 'p1';
  if (players.p2 === deviceId) return 'p2';
  return null;
}
function friendlyError(err, fallback) {
  const message = String(err?.message || fallback);
  if (message.includes('permission_denied')) return 'Permission denied. Check Realtime DB rules and click Publish.';
  if (message.includes('network')) return 'Network issue. Check internet connection and retry.';
  return message;
}

function runLobbyAnimations() {
  try {
    animate('#lobbyPage', { opacity: [0, 1], y: [18, 0] }, { duration: 0.45 });
    animate('#lobbyPage .room-controls > *', { opacity: [0, 1], scale: [0.96, 1] }, { delay: stagger(0.05), duration: 0.35 });
  } catch (err) {
    logError('lobby animation failed', err);
  }
}
function runGameAnimations() {
  try {
    animate('.top-tray', { opacity: [0, 1], y: [-14, 0] }, { duration: 0.4 });
    animate('#status', { opacity: [0, 1], y: [12, 0] }, { duration: 0.35 });
  } catch (err) {
    logError('game animation failed', err);
  }
}

function enterGamePage() {
  state.inGamePage = true;
  lobbyPage.classList.add('hidden');
  gamePage.classList.remove('hidden');
  runGameAnimations();
}
function enterLobbyPage() {
  state.inGamePage = false;
  gamePage.classList.add('hidden');
  lobbyPage.classList.remove('hidden');
  runLobbyAnimations();
}

function pointOnCircle(center, approachPoint, radius) {
  const dx = center.x - approachPoint.x;
  const dy = center.y - approachPoint.y;
  const len = Math.hypot(dx, dy) || 1;
  return { x: center.x - (dx / len) * radius, y: center.y - (dy / len) * radius };
}
function toSegments(path) {
  const segs = [];
  for (let i = 1; i < path.length; i++) segs.push({ a: path[i - 1], b: path[i] });
  return segs;
}
function ccw(a, b, c) { return (c.y - a.y) * (b.x - a.x) > (b.y - a.y) * (c.x - a.x); }
function segmentsIntersect(a, b, c, d) {
  if ((a.x === c.x && a.y === c.y) || (a.x === d.x && a.y === d.y) || (b.x === c.x && b.y === c.y) || (b.x === d.x && b.y === d.y)) return false;
  return ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
}
function isValidPath(game, path, fromId, toId) {
  for (const p of path) {
    if (p.x < 14 || p.y < 14 || p.x > canvas.width - 14 || p.y > canvas.height - 14) return false;
  }
  const blocked = POINTS.filter((p) => p.id !== Number(fromId) && p.id !== Number(toId));
  for (const p of path) {
    for (const node of blocked) if (dist(p, node) < node.r + 5) return false;
    if (fromId !== 'H' && toId !== 'H' && dist(p, HOUSE) < HOUSE.r + 6) return false;
  }
  const segs = toSegments(path);
  for (const line of game.lines || []) {
    const prev = toSegments(line.points || []);
    for (const s1 of segs) for (const s2 of prev) if (segmentsIntersect(s1.a, s1.b, s2.a, s2.b)) return false;
  }
  return true;
}

function renderHotspots() {
  const game = state.game;
  const isCallerTurn = state.yourRole === game.caller && game.selectedTarget == null && !game.gameOver;
  if (!state.roomCode || !isCallerTurn) {
    hotspotsEl.innerHTML = '';
    return;
  }
  const visited = new Set(game.visited || []);
  hotspotsEl.innerHTML = POINTS.map((point) => {
    const left = (point.x / 700) * 100;
    const top = (point.y / 1560) * 100;
    const disabled = visited.has(point.id) ? 'disabled' : '';
    return `<button class="hotspot-btn" data-id="${point.id}" style="left:${left}%;top:${top}%;" ${disabled} aria-label="Select ${point.id}"></button>`;
  }).join('');
}

function updateTopTray() {
  const game = state.game;
  turnPillEl.innerHTML = `<strong>Turn:</strong> ${label(game.caller)} calls → ${label(game.drawer)} draws`;
  const selected = game.selectedTarget == null ? 'None' : (game.selectedTarget === 'H' ? 'Cat House' : game.selectedTarget);
  selectedPillEl.innerHTML = `<strong>Selected:</strong> ${selected}`;
  rolePillEl.innerHTML = `<strong>You:</strong> ${state.yourRole ? label(state.yourRole) : '-'}`;
  lobbyRoomLabelEl.textContent = state.roomCode ? `Room ${state.roomCode} • ${state.players.p1 ? 'P1✅' : 'P1❌'} ${state.players.p2 ? 'P2✅' : 'P2❌'}` : 'No room yet.';
}

function drawPath(points, color, width) {
  if (points.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke();
}
function drawNode(point, active = false) {
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = active ? '#f97316' : '#0f172a';
  ctx.lineWidth = active ? 3 : 2;
  ctx.beginPath();
  ctx.arc(point.x, point.y, point.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#0f172a';
  ctx.font = '700 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(point.id), point.x, point.y + 1);
}
function draw() {
  const game = state.game;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const line of game.lines || []) drawPath(line.points, line.drawer === 'p1' ? '#2563eb' : '#16a34a', 2.5);
  if (state.drawing) drawPath(state.drawing, '#dc2626', 2);

  const t = performance.now() / 1000;
  const pulse = Math.sin(t * 2.8) * 1.8;
  const earWiggle = Math.sin(t * 3.6) * 2.2;
  const hr = HOUSE.r + pulse;

  ctx.fillStyle = '#fde68a';
  ctx.strokeStyle = game.selectedTarget === 'H' ? '#14b8a6' : '#92400e';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(HOUSE.x, HOUSE.y, hr, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#fcd34d';
  ctx.beginPath();
  ctx.moveTo(HOUSE.x - 14, HOUSE.y - hr + 6);
  ctx.lineTo(HOUSE.x - 3 + earWiggle, HOUSE.y - hr - 11);
  ctx.lineTo(HOUSE.x + 2, HOUSE.y - hr + 6);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(HOUSE.x + 14, HOUSE.y - hr + 6);
  ctx.lineTo(HOUSE.x + 3 - earWiggle, HOUSE.y - hr - 11);
  ctx.lineTo(HOUSE.x - 2, HOUSE.y - hr + 6);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#78350f';
  ctx.font = '700 12px Fredoka, Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('CAT', HOUSE.x, HOUSE.y - 5);
  ctx.fillText('HOME', HOUSE.x, HOUSE.y + 8);

  POINTS.forEach((point) => drawNode(point, game.selectedTarget === point.id));
  updateTopTray();
}

async function createRoom() {
  createRoomBtn.disabled = true;
  setLobbyStatus('Creating room...');
  try {
    let code = randomCode();
    let available = false;
    for (let i = 0; i < 8; i++) {
      const snap = await get(roomPath(code));
      if (!snap.exists()) {
        available = true;
        break;
      }
      code = randomCode();
    }
    if (!available) throw new Error('Could not generate empty room code. Retry.');

    await set(roomPath(code), {
      players: { p1: deviceId, p2: null },
      game: initialGame(true),
      updatedAt: Date.now()
    });

    roomCodeInput.value = code;
    setLobbyStatus(`Room ${code} created. Share code with Player 2.`);
    subscribeRoom(code);
    enterGamePage();
  } catch (err) {
    logError('createRoom failed', err);
    setLobbyStatus(friendlyError(err, 'Could not create room.'));
  } finally {
    createRoomBtn.disabled = false;
  }
}

function subscribeRoom(code) {
  if (state.unsubscribe) state.unsubscribe();
  state.roomCode = code;
  state.connected = false;
  state.unsubscribe = onValue(roomPath(code), (snap) => {
    state.connected = true;
    if (!snap.exists()) {
      setLobbyStatus('Room not found or removed.');
      setStatus('Room not found or removed.');
      state.roomCode = null;
      state.players = { p1: false, p2: false };
      state.yourRole = null;
      state.game = initialGame();
      enterLobbyPage();
      draw();
      return;
    }

    const data = snap.val();
    const players = data.players || {};
    state.players = { p1: Boolean(players.p1), p2: Boolean(players.p2) };
    state.yourRole = determineRole(players);
    state.game = data.game || initialGame();
    state.drawing = null;
    setStatus(state.game.status || 'Game ready.');
    draw();
    renderHotspots();
  }, (err) => {
    state.connected = false;
    logError('room subscription error', err);
    setStatus(friendlyError(err, 'Realtime DB connection issue.'));
    setLobbyStatus(friendlyError(err, 'Realtime DB connection issue.'));
    draw();
  });
}

async function joinRoomByCode(rawCode) {
  const code = String(rawCode || '').trim().toUpperCase();
  if (code.length !== 5) {
    setLobbyStatus('Room code must be 5 characters.');
    return;
  }

  joinRoomBtn.disabled = true;
  setLobbyStatus(`Joining room ${code}...`);

  try {
    let joined = false;
    for (let attempt = 0; attempt < 4 && !joined; attempt++) {
      const snap = await get(roomPath(code));
      if (!snap.exists()) {
        setLobbyStatus('Room code not found.');
        return;
      }

      const data = snap.val() || {};
      const players = data.players || {};

      if (players.p1 === deviceId || players.p2 === deviceId) {
        joined = true;
      } else if (!players.p1) {
        await update(roomPath(code), { 'players/p1': deviceId, updatedAt: Date.now() });
        joined = true;
      } else if (!players.p2) {
        await update(roomPath(code), { 'players/p2': deviceId, updatedAt: Date.now() });
        joined = true;
      } else {
        setLobbyStatus('Room is full.');
        return;
      }

      if (!joined) await new Promise((resolve) => setTimeout(resolve, 220));
    }

    if (!joined) {
      setLobbyStatus('Could not join room. Please retry.');
      return;
    }

    const latest = await get(roomPath(code));
    const latestData = latest.val() || {};
    const players = latestData.players || {};
    const bothReady = Boolean(players.p1 && players.p2);
    await update(roomPath(code), {
      updatedAt: Date.now(),
      game: {
        ...(latestData.game || initialGame()),
        status: bothReady ? 'Player 1: select a number for Player 2 to draw.' : 'Waiting for Player 2 to join room...'
      }
    });

    roomCodeInput.value = code;
    setLobbyStatus(`Joined room ${code}.`);
    subscribeRoom(code);
    enterGamePage();
  } catch (err) {
    logError('joinRoomByCode failed', err);
    setLobbyStatus(friendlyError(err, 'Join failed.'));
  } finally {
    joinRoomBtn.disabled = false;
  }
}

async function submitSelection(targetId) {
  if (!state.roomCode) return;
  try {
    const snap = await get(roomPath(state.roomCode));
    if (!snap.exists()) {
      setStatus('Room not found.');
      return;
    }
    const current = snap.val();
    const game = current.game || initialGame();
    if (game.gameOver || game.selectedTarget != null) return;
    if ((game.visited || []).includes(targetId)) return;

    game.selectedTarget = targetId;
    game.status = `${label(game.caller)} selected ${targetId}. ${label(game.drawer)} draw from ${game.currentId} to ${targetId}.`;
    await update(roomPath(state.roomCode), { game, updatedAt: Date.now() });
  } catch (err) {
    logError('submitSelection failed', err);
    setStatus(friendlyError(err, 'Could not select target.'));
  }
}

async function submitPath(rawPath) {
  if (!state.roomCode) return;
  try {
    await runTransaction(roomPath(state.roomCode), (current) => {
      if (!current) return current;
      const game = current.game || initialGame();
      if (game.gameOver || game.selectedTarget == null) return current;

      const from = pointById(game.currentId);
      const target = pointById(game.selectedTarget);
      const path = Array.isArray(rawPath) ? rawPath.map((p) => ({ x: Number(p.x), y: Number(p.y) })) : [];
      if (path.length < 2) {
        game.status = `Too short. Retry same turn: ${label(game.drawer)} draw again.`;
        return { ...current, game, updatedAt: Date.now() };
      }

      if (dist(path[0], from) > 1) path.unshift({ x: from.x, y: from.y });
      const end = path[path.length - 1];
      if (dist(end, target) > target.r + 16) {
        game.status = `Path must end on ${game.selectedTarget === 'H' ? 'Cat House' : `number ${game.selectedTarget}`}. Retry same turn.`;
        return { ...current, game, updatedAt: Date.now() };
      }

      const prev = path[path.length - 2] || path[0];
      path.push(pointOnCircle(target, prev, target.r));

      if (!isValidPath(game, path, game.currentId, game.selectedTarget)) {
        game.status = 'Line crossed/touched blocked area. Retry same turn.';
        return { ...current, game, updatedAt: Date.now() };
      }

      const visited = [...(game.visited || [])];
      const lines = [...(game.lines || [])];
      lines.push({ fromId: game.currentId, toId: game.selectedTarget, drawer: game.drawer, points: path });
      if (game.selectedTarget !== 'H') visited.push(game.selectedTarget);

      game.lines = lines;
      game.visited = visited;
      game.currentId = game.selectedTarget;

      if (game.selectedTarget === 'H' && visited.length === POINTS.length) {
        game.gameOver = true;
        game.status = `${label(game.drawer)} wins by connecting back to Cat House!`;
        return { ...current, game, updatedAt: Date.now() };
      }

      game.selectedTarget = null;
      [game.caller, game.drawer] = [game.drawer, game.caller];
      if (visited.length === POINTS.length) {
        game.selectedTarget = 'H';
        game.status = `${label(game.caller)} selected Cat House. ${label(game.drawer)} draw from ${game.currentId} back to Cat House.`;
      } else {
        game.status = `${label(game.caller)}: select a number for ${label(game.drawer)}.`;
      }
      return { ...current, game, updatedAt: Date.now() };
    });
  } catch (err) {
    logError('submitPath failed', err);
    setStatus(friendlyError(err, 'Could not submit draw.'));
  }
}

async function restartRoom() {
  if (!state.roomCode) {
    setStatus('Create or join a room first.');
    return;
  }
  try {
    await update(roomPath(state.roomCode), {
      game: initialGame(!(state.players.p1 && state.players.p2)),
      updatedAt: Date.now()
    });
  } catch (err) {
    logError('restartRoom failed', err);
    setStatus(friendlyError(err, 'Could not restart room.'));
  }
}

function leaveRoom() {
  if (state.unsubscribe) {
    state.unsubscribe();
    state.unsubscribe = null;
  }
  state.roomCode = null;
  state.yourRole = null;
  state.players = { p1: false, p2: false };
  state.game = initialGame();
  state.drawing = null;
  setLobbyStatus('Left room. Create or join another room.');
  setStatus('Left room.');
  enterLobbyPage();
  draw();
  renderHotspots();
}

function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: (t.clientX - rect.left) * (canvas.width / rect.width),
    y: (t.clientY - rect.top) * (canvas.height / rect.height)
  };
}
function hitNode(pos) {
  const available = POINTS.filter((point) => !state.game.visited.includes(point.id));
  for (const point of available) {
    if (dist(pos, point) <= point.r + 12) return point;
  }
  return null;
}

function startDraw(e) {
  if (!state.roomCode) return;
  const game = state.game;
  if (game.gameOver) return;
  if (game.selectedTarget == null || state.yourRole !== game.drawer) return;

  const pos = pointerPos(e);
  const from = pointById(game.currentId);
  if (dist(pos, from) > from.r + 16) return;
  state.drawing = [{ x: from.x, y: from.y }];
}
function moveDraw(e) {
  if (!state.drawing) return;
  const pos = pointerPos(e);
  const last = state.drawing.at(-1);
  if (dist(pos, last) <= 3) return;

  state.drawing.push(pos);
  const target = pointById(state.game.selectedTarget);
  if (target && dist(pos, target) <= target.r + 2) {
    finalizeDraw();
    return;
  }
  draw();
  renderHotspots();
}
function finalizeDraw() {
  if (!state.drawing) return;
  const game = state.game;
  const target = pointById(game.selectedTarget);
  const end = state.drawing.at(-1);
  const path = [...state.drawing];
  state.drawing = null;

  if (dist(end, target) > target.r + 16) {
    setStatus(`Path must end on ${game.selectedTarget === 'H' ? 'Cat House' : `number ${game.selectedTarget}`}. Retry same turn.`);
    draw();
    return;
  }
  const prev = path[path.length - 2] || path[0];
  path.push(pointOnCircle(target, prev, target.r));
  submitPath(path);
}

createRoomBtn.addEventListener('click', createRoom);
joinRoomBtn.addEventListener('click', () => joinRoomByCode(roomCodeInput.value));
roomCodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoomByCode(roomCodeInput.value); });
restartBtn.addEventListener('click', restartRoom);
leaveRoomBtn.addEventListener('click', leaveRoom);
hotspotsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.hotspot-btn');
  if (!btn || btn.disabled) return;
  submitSelection(Number(btn.dataset.id));
});

canvas.addEventListener('pointerdown', (e) => { startDraw(e); });
canvas.addEventListener('pointermove', (e) => { moveDraw(e); });
canvas.addEventListener('pointerup', finalizeDraw);
canvas.addEventListener('pointerleave', finalizeDraw);
canvas.addEventListener('touchstart', (e) => { startDraw(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { moveDraw(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', (e) => { finalizeDraw(); e.preventDefault(); }, { passive: false });

setStatus('Waiting for room...');
setLobbyStatus('Create a room or join with code.');
enterLobbyPage();
draw();
renderHotspots();

function frame() {
  if (state.inGamePage) draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
