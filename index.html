<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat's Cradle Duel (Firebase RTDB)</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(180deg, #eef3ff 0%, #f8fbff 100%);
      color: #12213f;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: calc(10px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));
    }
    .app { width: min(560px, 100%); display: grid; gap: 10px; }
    .top-tray {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: #0f172a;
      border-radius: 14px;
      padding: 12px;
      color: #e2e8f0;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .18);
      align-items: center;
    }
    .pill-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, .38);
      background: rgba(148, 163, 184, .2);
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }
    .pill strong { color: #93c5fd; }
    .restart {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      cursor: pointer;
    }
    .panel {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .08);
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .room-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .room-status { grid-column: 1 / -1; }
    .room-controls button, .room-controls input, .status {
      border-radius: 10px;
      border: 1px solid #ccdaef;
      font-size: 14px;
      padding: 10px;
      min-height: 42px;
    }
    .room-controls button {
      background: #edf3ff;
      font-weight: 700;
      cursor: pointer;
    }
    .room-controls button:disabled { opacity: .55; cursor: not-allowed; }
    .status {
      margin: 0;
      background: #e8f0ff;
      line-height: 1.35;
    }
    .hint { margin: 0; font-size: 12px; opacity: .85; }
    canvas {
      width: 100%;
      height: auto;
      max-height: calc(100dvh - 290px);
      border-radius: 10px;
      border: 1px solid #e6ebf5;
      background: #ffffff;
      touch-action: none;
      aspect-ratio: 9 / 20;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top-tray">
    <div class="pill-wrap">
      <div class="pill" id="turnPill">Turn: -</div>
      <div class="pill" id="selectedPill">Selected: -</div>
      <div class="pill" id="rolePill">Role: -</div>
      <div class="pill" id="connPill">Realtime DB: Connecting...</div>
    </div>
    <button id="restart" class="restart">Restart</button>
  </div>

  <div class="panel">
    <div class="room-controls">
      <button id="createRoom">Create Room</button>
      <div id="roomLabel" class="status room-status">No room yet.</div>
      <button id="joinRoom">Join Room</button>
      <input id="roomCodeInput" maxlength="5" placeholder="Paste room code" />
    </div>
    <p class="hint"><strong>Online:</strong> Create a room on one device, join from another device with code.</p>
  </div>

  <div class="panel">
    <canvas id="board" width="700" height="1560"></canvas>
    <div id="status" class="status"></div>
  </div>
</div>

<script>
  if (location.protocol === 'file:') window.__catsCradleFileMode = true;
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
import { getDatabase, ref, get, set, update, onValue, runTransaction } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js';

const firebaseConfig = {
  apiKey: 'AIzaSyB9B1ZXYPep-PeNeo_D35Kf1kofpB9GR3Q',
  authDomain: 'cats-cradle-10e30.firebaseapp.com',
  projectId: 'cats-cradle-10e30',
  storageBucket: 'cats-cradle-10e30.firebasestorage.app',
  messagingSenderId: '807058658558',
  appId: '1:807058658558:web:060f0292e84b0bcfde81af',
  databaseURL: 'https://cats-cradle-10e30-default-rtdb.europe-west1.firebasedatabase.app'
};

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const restartBtn = document.getElementById('restart');
const turnPillEl = document.getElementById('turnPill');
const selectedPillEl = document.getElementById('selectedPill');
const rolePillEl = document.getElementById('rolePill');
const connPillEl = document.getElementById('connPill');
const createRoomBtn = document.getElementById('createRoom');
const joinRoomBtn = document.getElementById('joinRoom');
const roomCodeInput = document.getElementById('roomCodeInput');
const roomLabel = document.getElementById('roomLabel');

if (window.__catsCradleFileMode) {
  const msg = 'Opened with file://. Start local server: python3 -m http.server 4173 then open http://localhost:4173';
  statusEl.textContent = msg;
  connPillEl.innerHTML = '<strong>Realtime DB:</strong> Blocked on file://';
  createRoomBtn.disabled = true;
  joinRoomBtn.disabled = true;
  throw new Error(msg);
}

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const HOUSE = { id: 'H', x: 350, y: 150, r: 28 };
function createGridPoints() {
  const columns = 3;
  const rows = 4;
  const left = 155;
  const right = 545;
  const top = 360;
  const bottom = 1170;
  const xStep = (right - left) / (columns - 1);
  const yStep = (bottom - top) / (rows - 1);
  const points = [];
  let id = 1;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < columns; col++) {
      points.push({ id, x: left + xStep * col, y: top + yStep * row, r: 24 });
      id += 1;
    }
  }
  return points;
}
const POINTS = createGridPoints();

function initialGame(waiting = false) {
  return {
    visited: [],
    lines: [],
    currentId: 'H',
    caller: 'p1',
    drawer: 'p2',
    selectedTarget: null,
    gameOver: false,
    status: waiting ? 'Waiting for Player 2 to join room...' : 'Player 1: select a number for Player 2 to draw.'
  };
}

const deviceId = (() => {
  const existing = localStorage.getItem('cats_cradle_device_id');
  if (existing) return existing;
  const fallback = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  const value = crypto?.randomUUID ? crypto.randomUUID() : fallback;
  localStorage.setItem('cats_cradle_device_id', value);
  return value;
})();

const state = {
  connected: false,
  roomCode: null,
  yourRole: null,
  players: { p1: false, p2: false },
  game: initialGame(),
  drawing: null,
  unsubscribe: null
};

function label(playerId) { return playerId === 'p1' ? 'Player 1' : 'Player 2'; }
function pointById(id) { return id === 'H' ? HOUSE : POINTS.find((p) => p.id === Number(id)); }
function setStatus(msg) { statusEl.textContent = msg; }
function canPlay() { return Boolean(state.roomCode && state.players.p1 && state.players.p2); }
function roomPath(code) { return ref(db, `rooms/${code}`); }
function randomCode() { return Math.random().toString(36).slice(2, 7).toUpperCase(); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function determineRole(players) {
  if (!players) return null;
  if (players.p1 === deviceId) return 'p1';
  if (players.p2 === deviceId) return 'p2';
  return null;
}
function friendlyError(err, fallback) {
  const message = String(err?.message || fallback);
  if (message.includes('permission_denied')) return 'Permission denied. Paste Realtime DB rules from README and publish.';
  if (message.includes('network')) return 'Network issue. Check internet connection and try again.';
  return message;
}
function pointOnCircle(center, approachPoint, radius) {
  const dx = center.x - approachPoint.x;
  const dy = center.y - approachPoint.y;
  const len = Math.hypot(dx, dy) || 1;
  return { x: center.x - (dx / len) * radius, y: center.y - (dy / len) * radius };
}

function toSegments(path) {
  const segs = [];
  for (let i = 1; i < path.length; i++) segs.push({ a: path[i - 1], b: path[i] });
  return segs;
}
function ccw(a, b, c) { return (c.y - a.y) * (b.x - a.x) > (b.y - a.y) * (c.x - a.x); }
function segmentsIntersect(a, b, c, d) {
  if ((a.x === c.x && a.y === c.y) || (a.x === d.x && a.y === d.y) || (b.x === c.x && b.y === c.y) || (b.x === d.x && b.y === d.y)) return false;
  return ccw(a, c, d) !== ccw(b, c, d) && ccw(a, b, c) !== ccw(a, b, d);
}
function isValidPath(game, path, fromId, toId) {
  for (const p of path) {
    if (p.x < 14 || p.y < 14 || p.x > canvas.width - 14 || p.y > canvas.height - 14) return false;
  }
  const blocked = POINTS.filter((p) => p.id !== Number(fromId) && p.id !== Number(toId));
  for (const p of path) {
    for (const node of blocked) if (dist(p, node) < node.r + 5) return false;
    if (fromId !== 'H' && toId !== 'H' && dist(p, HOUSE) < HOUSE.r + 6) return false;
  }
  const segs = toSegments(path);
  for (const line of game.lines || []) {
    const prev = toSegments(line.points || []);
    for (const s1 of segs) for (const s2 of prev) if (segmentsIntersect(s1.a, s1.b, s2.a, s2.b)) return false;
  }
  return true;
}

function updateTopTray() {
  const game = state.game;
  connPillEl.innerHTML = `<strong>Realtime DB:</strong> ${state.connected ? 'Connected' : 'Offline'}`;
  turnPillEl.innerHTML = `<strong>Turn:</strong> ${label(game.caller)} calls → ${label(game.drawer)} draws`;
  const selected = game.selectedTarget == null ? 'None' : (game.selectedTarget === 'H' ? 'Cat House' : game.selectedTarget);
  selectedPillEl.innerHTML = `<strong>Selected:</strong> ${selected}`;
  rolePillEl.innerHTML = `<strong>You:</strong> ${state.yourRole ? label(state.yourRole) : '-'}`;
  roomLabel.textContent = state.roomCode ? `Room ${state.roomCode} • ${state.players.p1 ? 'P1✅' : 'P1❌'} ${state.players.p2 ? 'P2✅' : 'P2❌'}` : 'No room yet.';
}

function drawPath(points, color, width) {
  if (points.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke();
}
function drawNode(point, active = false) {
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = active ? '#f97316' : '#0f172a';
  ctx.lineWidth = active ? 3 : 2;
  ctx.beginPath();
  ctx.arc(point.x, point.y, point.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#0f172a';
  ctx.font = '700 22px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(point.id), point.x, point.y + 1);
}
function draw() {
  const game = state.game;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const line of game.lines || []) drawPath(line.points, line.drawer === 'p1' ? '#2563eb' : '#16a34a', 2.5);
  if (state.drawing) drawPath(state.drawing, '#dc2626', 2);

  ctx.fillStyle = '#fde68a';
  ctx.strokeStyle = game.selectedTarget === 'H' ? '#f97316' : '#92400e';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(HOUSE.x, HOUSE.y, HOUSE.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#78350f';
  ctx.font = '700 12px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('CAT', HOUSE.x, HOUSE.y - 5);
  ctx.fillText('HOUSE', HOUSE.x, HOUSE.y + 8);

  POINTS.forEach((point) => drawNode(point, game.selectedTarget === point.id));
  updateTopTray();
}

async function createRoom() {
  createRoomBtn.disabled = true;
  setStatus('Creating room...');
  try {
    let code = randomCode();
    let available = false;
    for (let i = 0; i < 8; i++) {
      const snap = await get(roomPath(code));
      if (!snap.exists()) {
        available = true;
        break;
      }
      code = randomCode();
    }
    if (!available) throw new Error('Could not generate an empty room code. Please retry.');

    await set(roomPath(code), {
      players: { p1: deviceId, p2: null },
      game: initialGame(true),
      updatedAt: Date.now()
    });

    roomCodeInput.value = code;
    subscribeRoom(code);
    setStatus(`Room ${code} created. Share code with Player 2.`);
  } catch (err) {
    setStatus(friendlyError(err, 'Could not create room.'));
  } finally {
    createRoomBtn.disabled = false;
  }
}

function subscribeRoom(code) {
  if (state.unsubscribe) state.unsubscribe();
  state.roomCode = code;
  state.connected = false;
  state.unsubscribe = onValue(roomPath(code), (snap) => {
    state.connected = true;
    if (!snap.exists()) {
      setStatus('Room not found.');
      state.roomCode = null;
      draw();
      return;
    }

    const data = snap.val();
    const players = data.players || {};
    state.players = { p1: Boolean(players.p1), p2: Boolean(players.p2) };
    state.yourRole = determineRole(players);
    state.game = data.game || initialGame();
    state.drawing = null;
    draw();
  }, (err) => {
    state.connected = false;
    setStatus(friendlyError(err, 'Realtime DB connection issue.'));
    draw();
  });
}

async function joinRoomByCode(rawCode) {
  const code = String(rawCode || '').trim().toUpperCase();
  if (code.length !== 5) {
    setStatus('Room code must be 5 characters.');
    return;
  }

  joinRoomBtn.disabled = true;
  setStatus(`Joining room ${code}...`);
  try {
    let committed = false;
    for (let attempt = 0; attempt < 4 && !committed; attempt++) {
      const result = await runTransaction(roomPath(code), (current) => {
        if (!current) return;
        const players = current.players || {};

        if (players.p1 !== deviceId && players.p2 !== deviceId) {
          if (!players.p1) players.p1 = deviceId;
          else if (!players.p2) players.p2 = deviceId;
          else return;
        }

        const bothReady = Boolean(players.p1 && players.p2);
        const game = current.game || initialGame();
        game.status = bothReady ? 'Player 1: select a number for Player 2 to draw.' : 'Waiting for Player 2 to join room...';
        return { ...current, players, game, updatedAt: Date.now() };
      });
      committed = Boolean(result?.committed);
      if (!committed) await new Promise((resolve) => setTimeout(resolve, 250));
    }

    if (!committed) {
      const existing = await get(roomPath(code));
      if (!existing.exists()) setStatus('Room code not found.');
      else {
        const players = existing.val()?.players || {};
        const openSeat = !players.p1 || !players.p2 || players.p1 === deviceId || players.p2 === deviceId;
        setStatus(openSeat ? 'Join retry failed. Tap Join Room again.' : 'Room is full.');
      }
      return;
    }

    roomCodeInput.value = code;
    subscribeRoom(code);
    setStatus(`Joined room ${code}.`);
  } catch (err) {
    setStatus(friendlyError(err, 'Join failed.'));
  } finally {
    joinRoomBtn.disabled = false;
  }
}

async function submitSelection(targetId) {
  if (!state.roomCode) return;
  try {
    await runTransaction(roomPath(state.roomCode), (current) => {
      if (!current) return current;
      const game = current.game || initialGame();
      if (game.gameOver || game.selectedTarget != null) return current;
      if (determineRole(current.players) !== game.caller) return current;
      if ((game.visited || []).includes(targetId)) return current;

      game.selectedTarget = targetId;
      game.status = `${label(game.caller)} selected ${targetId}. ${label(game.drawer)} draw from ${game.currentId} to ${targetId}.`;
      return { ...current, game, updatedAt: Date.now() };
    });
  } catch (err) {
    setStatus(friendlyError(err, 'Could not select target.'));
  }
}

async function submitPath(rawPath) {
  if (!state.roomCode) return;
  try {
    await runTransaction(roomPath(state.roomCode), (current) => {
      if (!current) return current;
      const game = current.game || initialGame();
      if (game.gameOver || game.selectedTarget == null) return current;
      if (determineRole(current.players) !== game.drawer) return current;

      const from = pointById(game.currentId);
      const target = pointById(game.selectedTarget);
      const path = Array.isArray(rawPath) ? rawPath.map((p) => ({ x: Number(p.x), y: Number(p.y) })) : [];
      if (path.length < 2) {
        game.status = `Too short. Retry same turn: ${label(game.drawer)} draw again.`;
        return { ...current, game, updatedAt: Date.now() };
      }

      if (dist(path[0], from) > 1) path.unshift({ x: from.x, y: from.y });
      const end = path[path.length - 1];
      if (dist(end, target) > target.r + 16) {
        game.status = `Path must end on ${game.selectedTarget === 'H' ? 'Cat House' : `number ${game.selectedTarget}`}. Retry same turn.`;
        return { ...current, game, updatedAt: Date.now() };
      }

      const prev = path[path.length - 2] || path[0];
      path.push(pointOnCircle(target, prev, target.r));

      if (!isValidPath(game, path, game.currentId, game.selectedTarget)) {
        game.status = 'Line crossed/touched blocked area. Retry same turn.';
        return { ...current, game, updatedAt: Date.now() };
      }

      const visited = [...(game.visited || [])];
      const lines = [...(game.lines || [])];
      lines.push({ fromId: game.currentId, toId: game.selectedTarget, drawer: game.drawer, points: path });
      if (game.selectedTarget !== 'H') visited.push(game.selectedTarget);

      game.lines = lines;
      game.visited = visited;
      game.currentId = game.selectedTarget;

      if (game.selectedTarget === 'H' && visited.length === POINTS.length) {
        game.gameOver = true;
        game.status = `${label(game.drawer)} wins by connecting back to Cat House!`;
        return { ...current, game, updatedAt: Date.now() };
      }

      game.selectedTarget = null;
      [game.caller, game.drawer] = [game.drawer, game.caller];
      if (visited.length === POINTS.length) {
        game.selectedTarget = 'H';
        game.status = `${label(game.caller)} selected Cat House. ${label(game.drawer)} draw from ${game.currentId} back to Cat House.`;
      } else {
        game.status = `${label(game.caller)}: select a number for ${label(game.drawer)}.`;
      }
      return { ...current, game, updatedAt: Date.now() };
    });
  } catch (err) {
    setStatus(friendlyError(err, 'Could not submit draw.'));
  }
}

async function restartRoom() {
  if (!state.roomCode) {
    setStatus('Create or join a room first.');
    return;
  }
  try {
    await update(roomPath(state.roomCode), {
      game: initialGame(!(state.players.p1 && state.players.p2)),
      updatedAt: Date.now()
    });
  } catch (err) {
    setStatus(friendlyError(err, 'Could not restart room.'));
  }
}

function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: (t.clientX - rect.left) * (canvas.width / rect.width),
    y: (t.clientY - rect.top) * (canvas.height / rect.height)
  };
}
function hitNode(pos) {
  for (const point of POINTS) {
    if (!state.game.visited.includes(point.id) && dist(pos, point) <= point.r + 10) return point;
  }
  return null;
}

function boardClick(e) {
  if (!canPlay()) return;
  const game = state.game;
  if (game.gameOver || game.selectedTarget != null || state.yourRole !== game.caller) return;
  const node = hitNode(pointerPos(e));
  if (node) submitSelection(node.id);
}

function startDraw(e) {
  if (!canPlay()) return;
  const game = state.game;
  if (game.gameOver || game.selectedTarget == null || state.yourRole !== game.drawer) return;

  const from = pointById(game.currentId);
  const pos = pointerPos(e);
  if (dist(pos, from) > from.r + 16) return;
  state.drawing = [{ x: from.x, y: from.y }];
}

function moveDraw(e) {
  if (!state.drawing) return;
  const pos = pointerPos(e);
  const last = state.drawing.at(-1);
  if (dist(pos, last) <= 3) return;

  state.drawing.push(pos);
  const target = pointById(state.game.selectedTarget);
  if (target && dist(pos, target) <= target.r + 2) {
    finalizeDraw();
    return;
  }
  draw();
}

function finalizeDraw() {
  if (!state.drawing) return;

  const game = state.game;
  const target = pointById(game.selectedTarget);
  const end = state.drawing.at(-1);
  const path = [...state.drawing];
  state.drawing = null;

  if (dist(end, target) > target.r + 16) {
    setStatus(`Path must end on ${game.selectedTarget === 'H' ? 'Cat House' : `number ${game.selectedTarget}`}. Retry same turn.`);
    draw();
    return;
  }

  const prev = path[path.length - 2] || path[0];
  path.push(pointOnCircle(target, prev, target.r));
  submitPath(path);
}

createRoomBtn.addEventListener('click', createRoom);
joinRoomBtn.addEventListener('click', () => joinRoomByCode(roomCodeInput.value));
roomCodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoomByCode(roomCodeInput.value); });
restartBtn.addEventListener('click', restartRoom);

canvas.addEventListener('click', boardClick);
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', finalizeDraw);
canvas.addEventListener('mouseleave', finalizeDraw);
canvas.addEventListener('touchstart', (e) => { startDraw(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { moveDraw(e); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', (e) => { finalizeDraw(); e.preventDefault(); }, { passive: false });

setStatus('Ready. Create room or join with code.');
draw();
</script>
</body>
</html>
